repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        name: Ruff lint
        args:
          - --fix
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: Ruff format
        types_or:
          - python
          - pyi
            